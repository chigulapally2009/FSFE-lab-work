<!DOCTYPE html>
<html lang="en">
<head>
    <title>
        HTML Lists Example
    </title>
</head>
<body>
    <h1>
        1. Unordered List (ul)
    </h1>
    <ul>
        <li>Blue</li>
        <li>Red</li>
        <li>Green</li>
    </ul>
    <h1>
        2. Ordered List (ol)
    </h1>
    <ol>
        <li>Wake up</li>
        <li>Code in VS Code</li>
        <li>Sleep</li>
    </ol>
    <h1>
        3. Description List (dl)
    </h1>
    <dl>
        <dt>
            HTML
        </dt>
        <dd>
            HyperText Markup Language - used for structure.
        </dd>
        <dt>
            CSS
        </dt>
        <dd>
            Cascading Style Sheets - used for styling.
        </dd>
    </dl>
</body>
</html>
